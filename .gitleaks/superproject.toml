# Superproject pass only. Gitlink passes read .gitleaks/secrets.toml
# for the pinned private gitlinks and .gitleaks/gitlink.toml for every
# other gitlink.
# Content-scoped allowlists only: a paths entry makes gitleaks skip the
# whole file before scanning it.
[extend]
useDefault = true

[[allowlists]]
description = "DNSCrypt resolvers-list public minisign verification key"
regexes = ["RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3"]
