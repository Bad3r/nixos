keys:
  - &host_pub_key age1llvnvaarx3l5kn3t4mgggt9khkrv38v4lxsvdleg2rxxslqf0qxsnq4laf

creation_rules:
  - path_regex: secrets/r2\.env
    key_groups:
      - age:
          - *host_pub_key

  - path_regex: secrets/r2\.yaml
    key_groups:
      - age:
          - *host_pub_key

  # Deny by default. This rule must stay last: SOPS applies the first
  # matching creation rule, so it would shadow every rule below it. The
  # secrets-no-cleartext flake check enforces this policy's security
  # contract; update both in the same change.
  - path_regex: secrets/.*
    key_groups:
      - age:
          - *host_pub_key
