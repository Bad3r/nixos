name: Install Lix
description: >-
  Install the digest-pinned Lix release with this flake's nix.conf and caches.
inputs:
  github-token:
    description: Token recorded as the github.com access-tokens conf entry.
    required: true
runs:
  using: composite
  steps:
    - name: Install Lix
      shell: bash
      env:
        # The Lix that CI installs. The ci-lix-installer-parity flake check
        # fails when LIX_VERSION drifts from lixPackageSets.latest in the
        # nixpkgs pin; LIX_TARBALL_SHA256 is the release's .sha256 sidecar.
        LIX_VERSION: 2.95.3
        LIX_TARBALL_SHA256: 84a25e2adef9540fa61f77f5ed998c36337751ca27cea6aa6438f83eb38bf0d3
        # install.lix.systems skips some Lix releases and publishes no
        # digest sidecar, so the installer is pinned on its own, first-use,
        # and installs the tarball above through --nix-package-url.
        INSTALLER_VERSION: 2.95.2
        INSTALLER_SHA256: 57564e78a6d57126661fe5e793de70a72bacf9835ddb7c5c0cbfadf3db21545e
        # flake-self-attrs is required for this flake's
        # self.submodules = true and must be ambient: Lix enforces it
        # before flake.nix#nixConfig applies. Append-only on purpose: the
        # installer's own base conf already appends nix-command flakes,
        # and this payload is rewritten from a parsed key map with
        # unspecified order, so a plain experimental-features line here
        # can be emitted after an extra- append and silently drop it
        # (reproduced with Lix 2.95.2). abort-on-warn = false is the Lix
        # default, restated to record the decision that third-party
        # deprecated-syntax warnings stay non-fatal in CI.
        NIX_INSTALLER_EXTRA_CONF: |
          extra-experimental-features = pipe-operator flake-self-attrs
          abort-on-warn = false
          access-tokens = github.com=${{ inputs.github-token }}
      run: |-
        curl --proto '=https' --tlsv1.2 -sSf -o /tmp/lix-installer \
          "https://install.lix.systems/lix/$INSTALLER_VERSION/lix-installer-x86_64-linux"
        echo "$INSTALLER_SHA256  /tmp/lix-installer" | sha256sum -c -
        chmod +x /tmp/lix-installer
        tarball=/tmp/lix-x86_64-linux.tar.xz
        curl --proto '=https' --tlsv1.2 -sSf -o "$tarball" \
          "https://releases.lix.systems/lix/lix-$LIX_VERSION/lix-$LIX_VERSION-x86_64-linux.tar.xz"
        echo "$LIX_TARBALL_SHA256  $tarball" | sha256sum -c -
        # act containers have no systemd; fall back to a root-only install.
        extra_args=()
        if [ -n "${ACT:-}" ]; then extra_args+=(--init none); fi
        # Host substituters and keys, generated by write-files from
        # modules/hosts/common/nix-substituters.nix. They go into the daemon
        # conf so a build substitutes what a cache already serves; the runner
        # user is not trusted, so a client-side NIX_CONFIG would be ignored.
        conf="$GITHUB_ACTION_PATH/substituters.conf"
        for key in extra-substituters extra-trusted-public-keys; do
          if ! grep -q "^$key = " "$conf"; then
            echo "::error::$conf lacks $key; run write-files"
            exit 1
          fi
        done
        # One separator whether or not the env block kept its trailing newline.
        base="${NIX_INSTALLER_EXTRA_CONF%$'\n'}"
        NIX_INSTALLER_EXTRA_CONF="$base"$'\n'"$(cat "$conf")"
        # The installer appends /nix/var/nix/profiles/default/bin to
        # GITHUB_PATH itself (ConfigureShellProfile); sudo -E keeps the
        # variable visible to it.
        sudo -E /tmp/lix-installer install linux --no-confirm \
          --nix-package-url "$tarball" "${extra_args[@]}"
        # Without --nix-package-url the installer falls back to its own release.
        read -r installed < <(/nix/var/nix/profiles/default/bin/nix --version)
        if [[ "$installed" != *" $LIX_VERSION" ]]; then
          echo "::error::installed '$installed', expected Lix $LIX_VERSION"
          exit 1
        fi
    - name: Verify substituters
      shell: bash
      # The installer rewrites the extra conf from a parsed key map, so the
      # installed result is what counts, not the payload.
      run: |-
        for setting in substituters trusted-public-keys; do
          read -ra want <<< "$(sed -n "s/^extra-$setting = //p" \
            "$GITHUB_ACTION_PATH/substituters.conf")"
          if [ "${#want[@]}" -eq 0 ]; then
            echo "::error::extra-$setting is missing from substituters.conf"
            exit 1
          fi
          effective=" $(nix config show "$setting") "
          for value in "${want[@]}"; do
            if [[ "$effective" != *" $value "* ]]; then
              echo "::error::$value is missing from the installed $setting"
              exit 1
            fi
          done
        done
