# nixpkgs-unfree.cachix.org serves unfree packages such as unrar.
# bad3r-nixos.cachix.org serves the CI-built cache roots; see
# docs/reference/binary-cache-coverage.md.
extra-substituters = https://cache.numtide.com https://nixpkgs-unfree.cachix.org https://bad3r-nixos.cachix.org
extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= nixpkgs-unfree.cachix.org-1:hqvoInulhbV4nJ9yJOEr+4wxhDV4xq2d1DK7S6Nj6rs= bad3r-nixos.cachix.org-1:CWwJIEV6kogZP/xZPRXdT6hkKvs84haLxYgK9oF59JE=
connect-timeout = 30
download-attempts = 3
# stalled-download-timeout is the nix default, restated to fail a stalled
# download instead of freezing the build.
stalled-download-timeout = 300
