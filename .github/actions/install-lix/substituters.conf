# nixpkgs-unfree.cachix.org serves unfree packages such as unrar.
# cache.nixos-cuda.org serves the CUDA libraries llama.cpp builds against.
# bad3r-nixos.cachix.org serves the CI-built cache roots; see
# docs/reference/binary-cache-coverage.md.
# nix-logseq-git-flake.cachix.org serves the logseq and logseq-cli inputs.
extra-substituters = https://cache.numtide.com https://nixpkgs-unfree.cachix.org https://cache.nixos-cuda.org https://bad3r-nixos.cachix.org https://nix-logseq-git-flake.cachix.org
extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= nixpkgs-unfree.cachix.org-1:hqvoInulhbV4nJ9yJOEr+4wxhDV4xq2d1DK7S6Nj6rs= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M= bad3r-nixos.cachix.org-1:CWwJIEV6kogZP/xZPRXdT6hkKvs84haLxYgK9oF59JE= nix-logseq-git-flake.cachix.org-1:DSBNW07PSRyCvS926tpIWahb53OIydwwZhsP6LhJNZo=
connect-timeout = 30
download-attempts = 3
# stalled-download-timeout is the nix default, restated to fail a stalled
# download instead of freezing the build.
stalled-download-timeout = 300
