---
name: Dendritic Pattern Compliance Check
"on":
  # The flake checks carry eval-time guards that fail only when something
  # forces checks.<system>: cache-roots-allowlist-disjoint and
  # bootstrap-substituter-parity. On dispatch alone they enforce nothing at
  # review time, which is when the drift they catch is introduced.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  # Two of these jobs install Lix and run a full flake evaluation, so a
  # superseded run is pure waste. cache-push.yml opts out because its long
  # builds are worth preserving; nothing here builds.
  group: check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  # No job here writes. The trigger above mints this token for every pull
  # request, and it reaches ./.github/actions/install-lix, which resolves
  # from the pull request head.
  contents: read
jobs:
  flake-lock-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check Nixpkgs lock health
        uses: DeterminateSystems/flake-checker-action@v13
        with:
          send-statistics: false
          fail-mode: true
          # CEL has() only accepts field selectors, not bare variables.
          # Keep in sync with modules/meta/pre-commit.nix.
          condition: >-
            supportedRefs.contains(gitRef) && numDaysOld < 30
            && owner == 'Bad3r'

  check-compliance:
    runs-on: ubuntu-latest
    # Installs Lix and evaluates the whole flake. Nothing on the runner
    # sets stalled-download-timeout, so a stuck substituter fetch would
    # otherwise hold a runner and this concurrency slot for the 6 hour
    # job default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Lix
        uses: ./.github/actions/install-lix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prefer HTTPS for GitHub
        run: |
          URL="https://github.com/"
          git config --global url."$URL".insteadOf git@github.com:
          git config --global url."$URL".insteadOf ssh://git@github.com/
      # "path:." bypasses the git fetcher: self.submodules = true would
      # make a git-based self fetch pull the private secrets submodule
      # that CI cannot read; the per-file pathExists guards then evaluate
      # the secretless configuration. nix eval instead of
      # `nix flake check --no-build` and `nix build --dry-run`: Lix forces
      # read-only store mode for both (lix/nix/flake.cc), so eval-time
      # store writes (interpolated source copies, IFD derivations) fail on
      # the fresh runner store. Forcing every check's drvPath keeps the
      # same eval surface as `nix flake check`: package-checks.nix mirrors
      # every package into checks and make-shell exposes each dev shell as
      # a `<name>-shell` check, so both still evaluate here; apps is empty
      # and formatter runs in the format-check job. Never builds check
      # outputs (the checks include every host toplevel, and building them
      # exceeds runner disk).
      - name: Check flake
        run: |
          nix eval --accept-flake-config --json \
            "path:.#checks.x86_64-linux" \
            --apply 'checks: builtins.mapAttrs (_: check: check.drvPath) checks'
      # The step above only forces drvPaths, so checks that assert at run time
      # would never execute. Build just those by name: they are small and
      # sandbox-clean, unlike the host toplevels the exclusion above exists
      # for. The list comes from the flake: a script suite matches by name, and
      # anything else opts in by setting runtimeCheck on its derivation, so a
      # new runtime check is covered without editing this workflow. An empty
      # list fails rather than passing vacuously.
      - name: Run runtime check suites
        run: |
          suites=$(nix eval --accept-flake-config --json \
            "path:.#checks.x86_64-linux" --apply 'checks:
              builtins.filter
                (n: ((builtins.getAttr n checks).runtimeCheck or false)
                    || builtins.match "script-tests-.*" n != null)
                (builtins.attrNames checks)' \
            | jq -r '.[]')
          if [ -z "$suites" ]; then
            echo "no runtime checks found" >&2
            exit 1
          fi
          installables=()
          for s in $suites; do
            installables+=("path:.#checks.x86_64-linux.\"$s\"")
          done
          nix build --accept-flake-config --no-link \
            --print-build-logs "${installables[@]}"
      # Force every host closure's drvPath. The host list comes from the
      # flake, so a new host is covered without editing this workflow; an
      # empty list fails instead of passing vacuously. nix eval (not
      # nix build --dry-run) because Lix forces read-only store mode for
      # dry-run, which breaks eval-time store writes on the fresh runner.
      - name: Build configurations
        run: |
          hosts=$(nix eval --accept-flake-config --json \
            "path:.#nixosConfigurations" --apply builtins.attrNames \
            | jq -r '.[]')
          if [ -z "$hosts" ]; then
            echo "no nixosConfigurations found" >&2
            exit 1
          fi
          for host in $hosts; do
            echo "Forcing $host toplevel drvPath..."
            nix eval --accept-flake-config --raw \
              "path:.#nixosConfigurations.$host.config.system.build.toplevel.drvPath"
          done

  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Lix
        uses: ./.github/actions/install-lix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # nix fmt resolves .#formatter through the git fetcher, which would
      # pull the private secrets submodule; run the formatter from the
      # path-fetched flake instead.
      - name: Check formatting
        run: >-
          nix run --accept-flake-config
          "path:.#formatter.x86_64-linux" -- --ci

  module-validation:
    runs-on: ubuntu-latest
    # No Nix here: every step is plain grep/awk/find over the checkout.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate namespaces
        run: |
          # Forbid assigning a single module directly to a retired namespace.
          # Anchored on "=" so nested groups (flake.nixosModules.storage.x)
          # and hyphenated names (flake.nixosModules.boot-redundancy) pass.
          if grep -rqE "flake\.nixosModules\.desktop[[:space:]]*=" \
            modules/ --include="*.nix"; then exit 1; fi
          if grep -rqE "flake\.nixosModules\.audio[[:space:]]*=" \
            modules/ --include="*.nix"; then exit 1; fi
          if grep -rqE "flake\.nixosModules\.boot[[:space:]]*=" \
            modules/ --include="*.nix"; then exit 1; fi
          if grep -rqE "flake\.nixosModules\.storage[[:space:]]*=" \
            modules/ --include="*.nix"; then exit 1; fi
      - name: Check import-tree usage
        run: grep -q "import-tree.*modules" flake.nix || exit 1
      - name: Check no literal imports
        run: |
          # Same multi-line detector as the generation-manager score check
          # (modules/apps/generation-manager.nix); keep the two in sync.
          # The previous single-line grep missed every path placed on a line
          # after "imports = [". Paths with any segment starting with "_"
          # are outside import-tree discovery and stay exempt.
          # shellcheck disable=SC2016
          detector='
            FNR == 1 { inblock = 0; depth = 0 }
            {
              line = $0
              sub(/#.*/, "", line)
              if (!inblock && line ~ /^[[:space:]]*imports[[:space:]]*=/) {
                inblock = 1
                depth = 0
              }
              if (inblock) {
                tmp = line
                while (match(tmp, "\\.\\.?/[A-Za-z0-9_./-]+")) {
                  p = substr(tmp, RSTART, RLENGTH)
                  n = split(p, parts, "/")
                  exempt = 0
                  for (i = 1; i <= n; i++) {
                    if (substr(parts[i], 1, 1) == "_") {
                      exempt = 1
                      break
                    }
                  }
                  if (!exempt) {
                    printf "%s:%d:%s\n", FILENAME, FNR, $0
                    break
                  }
                  tmp = substr(tmp, RSTART + RLENGTH)
                }
                depth += gsub(/\[/, "", line)
                depth -= gsub(/\]/, "", line)
                if (depth <= 0 && line ~ /;/) inblock = 0
              }
            }
          '
          # Self-test against a known violation so a broken awk cannot
          # produce a vacuous pass.
          selftest=$(printf '{\n  imports = [\n    ./x.nix\n  ];\n}\n' \
            | awk "$detector")
          if [ -z "$selftest" ]; then
            echo "literal-import detector self-test found nothing" >&2
            exit 1
          fi
          violations=$(find modules/ -name '*.nix' -print0 | \
            xargs -0 -r awk "$detector")
          if [ -n "$violations" ]; then
            echo "Literal path imports found:" >&2
            echo "$violations" >&2
            exit 1
          fi
