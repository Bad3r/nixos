---
# Mirror of anthropics/claude-code-action examples/pr-review-comprehensive.yml.
# Diff against upstream when bumping the action version.
name: PR Review with Progress Tracking

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-with-tracking:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # yamllint disable rule:line-length
    # Local policy (not from the upstream mirror): trusted authors and dependabot.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) ||
        github.event.pull_request.user.login == 'dependabot[bot]'
      )
    # yamllint enable rule:line-length
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # yamllint disable rule:line-length
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: PR Review with Progress Tracking
        uses: anthropics/claude-code-action@v1
        # yamllint enable rule:line-length
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          allowed_bots: "dependabot[bot]"

          # yamllint disable rule:line-length
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Report problems that need fixing and concrete enhancements worth making.

            Tag every comment with one of these in brackets:

            1. [ISSUE] something the author should fix: correctness bug, security hole, data corruption or loss risk, broken build, broken module evaluation, regression in existing behavior, logic flaw, off-by-one, race condition, wrong abstraction, hidden coupling, unsafe default, missing input validation at a trust boundary, missing test for new branching logic, missing docs for a new public option/API/CLI flag/env var, a documentation or comment claim about code or module behavior that the source contradicts (open the cited source to confirm before flagging).
            2. [ENHANCEMENT] non-blocking improvement with measurable impact: performance, maintainability, security hardening, error-handling robustness, reduced complexity, clearer error messages, safer defaults, better ergonomics, reduced foot-gun, simpler call sites.

            Pre-existing bugs or issues surfaced by the diff are in scope. Report them under [ISSUE] regardless of who introduced them or when.

            Rules:
            - No speculative concerns ("this might break if X happens later"). Comment only on problems that are concretely identifiable in the code as it stands.
            - Do not flag issues that depend on unstated assumptions about the codebase or the author's intent.
            - Every comment must propose a concrete fix or specific change. Vague "consider X" is not allowed; state what to change and why.
            - Testing and documentation gaps count only when substantive: new public API without docs, new branching logic without tests, new failure mode without coverage. Otherwise skip.
            - Do not pad with speculative or trivial items to inflate the count. If nothing is found, post a single top-level comment containing exactly: "No issues found."
            - Post inline comments for line-specific findings. Prefix with the bracketed tag.
            - Top-level comments only for cross-cutting findings that span multiple files or hunks.
            - Be terse.

          claude_args: |
            --model opus
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate),Read,Grep,Glob"
          # yamllint enable rule:line-length
