---
name: Upstream Tracker
"on":
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Single issue number (optional; default: all labeled open)"
        required: false
      dry_run:
        description: "Do not post comments or edit labels"
        type: boolean
        default: false
permissions:
  issues: write
  contents: read
jobs:
  track:
    runs-on: ubuntu-latest
    concurrency:
      group: upstream-tracker
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPSTREAM_TRACKER_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      ISSUE_NUMBER: ${{ inputs.issue }}
    steps:
      # yamllint disable rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # yamllint enable rule:line-length
        with:
          persist-credentials: false
      - name: Track upstream state
        run: .github/scripts/upstream-tracker.sh "${ISSUE_NUMBER:-}"
