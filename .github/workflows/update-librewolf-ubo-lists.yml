---
name: Update LibreWolf uBO Lists
"on":
  schedule:
    - cron: "15 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-librewolf-ubo-lists:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update generated list
        run: .github/scripts/update-librewolf-ubo-lists.sh

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(ublock): update LibreWolf filter lists"
          title: "chore(ublock): update LibreWolf filter lists"
          body: |
            ## Summary
            - Refresh generated uBlock Origin default filter lists.
            - Source: LibreWolf upstream uBO assets catalog.

            ## Test plan
            - Generated by `.github/scripts/update-librewolf-ubo-lists.sh`
            - Repository checks validate the Nix module import path.
          branch: automated/librewolf-ubo-lists
          delete-branch: true
          labels: |
            type(dependency-update)
            origin(automated)
            area(automation)
            area(home-manager)

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge --auto --squash "$PR_NUMBER"
